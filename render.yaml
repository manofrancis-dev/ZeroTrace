services:
  - type: web
    name: zero-trace
    runtime: docker
    dockerfilePath: ./backend/Dockerfile.render
    dockerContext: ./backend
    envVars:
      - key: PORT
        value: "10000"
      - key: CORS_ORIGINS
        value: https://manofrancis-dev.github.io
      - key: COOKIE_SECURE
        value: "true"
      - key: BROWSER_SESSION_SAMESITE
        value: none
      - key: SANDBOX_API_URL
        value: http://127.0.0.1:8001
      - key: ZERO_TRACE_API_KEY
        sync: false
      - key: VT_API_KEY
        sync: false
      - key: WEBRISK_API_KEY
        sync: false
    healthCheckPath: /health