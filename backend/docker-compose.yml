services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      SANDBOX_API_URL: "http://sandbox:8001"
      SANDBOX_API_KEY: "${SANDBOX_API_KEY:-replace-with-another-random-secret}"
    ports:
      - "8000:8000"
    depends_on:
      sandbox:
        condition: service_healthy
    restart: unless-stopped

  sandbox:
    build:
      context: ./sandbox
      dockerfile: Dockerfile
    environment:
      SANDBOX_API_KEY: "${SANDBOX_API_KEY:-replace-with-another-random-secret}"
    expose:
      - "8001"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2)"
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped